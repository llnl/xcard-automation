classes:
  genesis_datacard_merged_shared:
    title: genesis_datacard_merged_shared
    description: '<INSTRUCTIONS: Considerations for filling out the data card: Deciding
      the appropriate resolution for documenting a scientific dataset in a data card
      can be complex. Data cards may describe single or multiple data files, datasets,
      or versions. Too granular, and there will be too many data cards; too broad,
      and details may be lost. Consider the use, audience, and documentation the data
      card needs to provide to maintain transparency without duplication. Reflect
      on these relationships to balance clarity, usability, and sustainability.>'
    is_a: ont00000253
  supports_discoverability:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard_capabilities
      value:
        range: YesNo
    title: supports_discoverability
    description: '[required] Yes is required as all data cards must support basic
      discovery and identification of the dataset. Yes is required for all data cards.'
    is_a: ont00000965
  supports_interoperability:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard_capabilities
      value:
        range: YesNo
    title: supports_interoperability
    description: '[required] Set to Yes if this data card includes the metadata to
      support interoperability of the dataset. Does not necessary indicate that the
      dataset itself is interoperable, only that the data card includes all the metadata
      to support interoperability.'
    is_a: ont00000965
  supports_reusability:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard_capabilities
      value:
        range: YesNo
    title: supports_reusability
    description: '[required] Set to Yes if this data card includes the metadata to
      support reusability of the dataset. Does not necessary indicate that the dataset
      itself is reusable, only that the data card includes some metadata to support
      reusability.'
    is_a: ont00000965
  supports_governed_use:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard_capabilities
      value:
        range: YesNo
    title: supports_governed_use
    description: '[required] Set to Yes if this data card includes the metadata to
      support governed use of the dataset. Does not necessary indicate that the dataset
      itself is cleared for governed use, only that the data card includes some metadata
      to support governed use.'
    is_a: ont00000965
  supports_ai_usability:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard_capabilities
      value:
        range: YesNo
    title: supports_ai_usability
    description: '[required] Set to Yes if this data card includes the metadata to
      support AI usability of the dataset. Does not necessary indicate that the dataset
      itself is AI-usable, only that the data card includes some metadata to support
      AI usability.'
    is_a: ont00000965
  discoverability:
    slots:
    - bfo_BFO_0000101
    slot_usage:
      bfo_BFO_0000101:
        range: genesis_datacard_merged_shared
    title: discoverability
    description: "DATA CARD METADATA Describes this document itself \u2014 not the\
      \ dataset."
    is_a: ont00000853
  datacard:
    slots:
    - bfo_BFO_0000176
    slot_usage:
      bfo_BFO_0000176:
        range: discoverability
    title: datacard
    description: "Describes this document itself \u2014 not the dataset."
    is_a: ont00000853
  template_version:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: string
    title: template_version
    description: "[discoverability_required] DO NOT MODIFY \u2014 used by parsers\
      \ to apply version-specific logic"
    is_a: ont00000649
  datacard_version:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: string
    title: datacard_version
    description: "[discoverability_required] Version of this specific data card document.\
      \ Increment when the data card is meaningfully updated. Use semantic versioning:\
      \ MAJOR.MINOR.PATCH e.g., 1.0 \u2192 1.1 for content updates; 1.x \u2192 2.0\
      \ for structural changes"
    is_a: ont00000649
  filename:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: string
    title: filename
    description: '[discoverability_required] Follow naming convention; align with
      identification.name'
    is_a: ont00000649
  language:
    slots:
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: data_structure
      value:
        range: string
    title: language
    description: '[discoverability_required] ISO 639-1 language code for this data
      card''s content'
    is_a: ont00001175
  id:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: string
    title: id
    description: '[discoverability_if_applicable] Persistent identifier for this data
      card document itself, distinct from the dataset identifier. Assign if the data
      card is registered in a catalog or repository independently of the dataset.'
    is_a: ont00000292
  type:
    slots:
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: contributors
      value:
        range: value_identifier_set
    title: type
    description: doi | ark | handle | url | local | other
    is_a: ont00000853
  value:
    slots:
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard_checksum
      value:
        range: string
    title: value
    description: Link to model card or documentation if available
    is_a: ont00000853
  sensitivity:
    slots:
    - bfo_BFO_0000176
    - bfo_BFO_0000176
    slot_usage:
      bfo_BFO_0000176:
        range: discoverability
    title: sensitivity
    description: Sensitivity of the DATA CARD itself, which may differ from the sensitivity
      of the dataset it describes. Populate based on the sensitivity of the data card
      content alone, not the dataset. See NOTE ON SENSITIVITY above.
    is_a: ont00000853
  overall_sensitivity:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      value:
        range: security_set
    title: overall_sensitivity
    description: '[discoverability_required] The overall sensitivity of THE DATA CARD
      only. Set based solely on the sensitivity of this data card. not the dataset
      it describes. See NOTE ON SENSITIVITY above. The sensitivity of the data card
      and the dataset are independent and will often differ. Uses a controlled vocabulary:
      - Public: No sensitivity; publicly shareable. - Unclassified_Uncontrolled: Unclassified
      but uncontrolled; may have minimal sensitivity; generally shareable with minimal
      controls. - CUI: CUI (Controlled Unclassified Information); requires handling
      per CUI guidelines; access controls required. - UCNI: UCNI (Unclassified Controlled
      Nuclear Information); requires handling per UCNI guidelines; strict access controls
      required. - Classified: Classified information; requires handling per classification
      level and guide; strict access controls required. - Legacy_Controlled: Legacy
      controlled information; may have specific handling requirements based on legacy
      controls; access controls required. - Mixed: Mixed sensitivity; contains a combination
      of sensitive and non-sensitive information; handling requirements depend on
      the specific content; access controls required. - Other_Controlled: Other controlled
      information; may have specific handling requirements based on other controls;
      access controls required.'
    is_a: ont00000965
  source_marking_string:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001982
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001982:
        range: ont00000649
      value:
        range: string
    title: source_marking_string
    description: '[discoverability_required] If this data card has a source marking,
      provide the marking string exactly as it appears on the data card.'
    is_a: ont00000853
  source_marking_scheme:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001982
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001982:
        range: ont00000649
      value:
        range: marking_set
    title: source_marking_scheme
    description: '[discoverability_required] If this data card has a source marking,
      provide the marking scheme used. use vocabulary: DOE_CUI | DOE_UCNI | EO13526_Classified
      | AEA_RD_FRD_TFNI | DOD_CUI | DHS_CUI | Legacy_OUO | Legacy_Site_Specific |
      Other_Agency | None if a Legacy_OUO is unresolved to a current standard marking,
      normalized_control_basis should be populated as Legacy_Needs_Mapping to indicate
      that the control basis is legacy and needs interpretation for governance purposes.'
    is_a: ont00000853
  classified_status:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001942
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001942:
        range: ont00000751
      value:
        range: YesNo
    title: classified_status
    description: '[discoverability_required] Yes | No description: Indicates whether
      the asset is classified.'
    is_a: ont00000965
  classification_level:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001942
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001942:
        range: ont00000751
      value:
        range: classification_level_set
    title: classification_level
    description: '[discoverability_if_applicable] For classified information, top_secret
      | secret | confidential classification level'
    is_a: ont00000965
  classification_category:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001942
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001942:
        range: ont00000751
      value:
        range: classification_cat_set
    title: classification_category
    description: '[discoverability_if_applicable] For classified information, list
      the classification category or categories, if applicable. use vocabulary: NSI
      | RD | FRD | TFNI | Other_Classified'
    is_a: ont00000965
  classified_control_markings:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001942
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001942:
        range: ont00000751
      value:
        range: classification_set
    title: classified_control_markings
    description: '[discoverability_if_applicable] For classified information, list
      the specific control markings that apply, if any. Provide as a list of unique
      entries if multiple markings apply. e.g., - NOFORN - CNWDI - SIGMA 14 - REL
      TO USA, CAN, GBR - ORCON'
    is_a: ont00000965
  cui_status:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001942
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001942:
        range: ont00000751
      value:
        range: YesNo
    title: cui_status
    description: '[discoverability_required] Yes | No description: Indicates whether
      the asset is CUI.'
    is_a: ont00000965
  cui_basic_categories:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001982
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001982:
        range: ont00000751
    title: cui_basic_categories
    description: '[discoverability_if_applicable, at least one basic or specified
      category is required if cui_status = Yes] For CUI, list the basic category or
      categories that apply, if any. use DOE/ISOO-authoritative CUI Basic categories
      or subcategories. provide as a list of unique entries if multiple categories
      apply.'
    is_a: ont00000853
  cui_specified_categories:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001982
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001982:
        range: ont00000751
      value:
        range: string
    title: cui_specified_categories
    description: '[discoverability_if_applicable, at least one basic or specified
      category is required if cui_status = Yes] For CUI, list the specified category
      or categories that apply, if any. use DOE/ISOO-authoritative CUI Specified categories
      or subcategories. provide as a list of unique entries if multiple categories
      apply.'
    is_a: ont00000853
  cui_limited_dissemination_controls:
    slots:
    - bfo_BFO_0000176
    - cco_ont00001942
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      cco_ont00001942:
        range: ont00000751
      value:
        range: classification_set
    title: cui_limited_dissemination_controls
    description: '[discoverability_if_applicable] List the applicable CUI limited
      dissemination controls, if any. provide as a list of unique entries if multiple
      controls apply. e.g., - NOFORN - DL ONLY -  REL TO USA, GBR - DISPLAY ONLY USA,
      GBR - RELIDO If cui_limited_dissemination_controls contains NOFORN, REL TO...,
      DISPLAY ONLY..., or similar controls, foreign_national_access_status should
      be consistent with those controls.'
    is_a: ont00000965
  ucni_status:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      value:
        range: YesNo
    title: ucni_status
    description: '[discoverability_required] Yes | No description: Indicates whether
      the asset contains UCNI. UCNI is represented separately and should not be treated
      as an ordinary CUI category value.'
    is_a: ont00000853
  uk_mda_status:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      value:
        range: YesNoMaybeso
    title: uk_mda_status
    description: '[discoverability_if_applicable] Yes | No| Unknown | not_applicable
      Indicates whether the asset is subject to UK Ministry of Defence Assessment
      (MDA) controls.'
    is_a: ont00000686
  legacy_label_source:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
      value:
        range: string
    title: legacy_label_source
    description: '[discoverability_if_applicable]  Preserves deprecated or local historical
      control labels such as OUO, SBU, if source_marking_scheme = Legacy_OUO, legacy_label_source
      should be populated or site-specific legacy markings as provenance/source information
      only. Provide as a list of unique entries if multiple legacy labels apply. E.g.,
      - OUO - SBU'
    is_a: ont00000853
  normalized_control_basis:
    slots:
    - bfo_BFO_0000176
    slot_usage:
      bfo_BFO_0000176:
        range: sensitivity
    title: normalized_control_basis
    description: '[discoverability_if_applicable] Optional interpreted control basis
      used for governance where source materials This does not replace authoritative
      source markings. Provide as a list of unique entries if multiple control bases
      apply. If source_marking_scheme = Legacy_OUO and the legacy marking is unresolved
      to a current standard marking, this should be populated as Legacy_Needs_Mapping
      to indicate that the control basis is legacy and needs interpretation for governance
      purposes. Entries should use this controlled vocabulary: - Classified - CUI
      - UCNI - Public_Release_Approved - Legacy_Needs_Mapping - Other_Controlled'
    is_a: ont00000853
  created_date:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: date
    title: created_date
    description: '[discoverability_required] ISO 8601 date this data card was first
      created'
    is_a: ont00000529
  updated_date:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: date
    title: updated_date
    description: '[discoverability_required] ISO 8601 date of most recent update;
      revise on every change'
    is_a: ont00000529
  change_log:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: string
    title: change_log
    description: '[discoverability_required] Running history of meaningful changes
      to this data card. Add a new entry every time the data card is updated. Do not
      overwrite or delete prior entries.'
    is_a: ont00000853
  change_date:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: change_log
      value:
        range: date
    title: change_date
    description: '[discoverability_required] ISO 8601 date of this change'
    is_a: ont00000529
  summary:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: change_date
      value:
        range: string
    title: summary
    description: '[discoverability_required] Brief description of what changed and
      why. Update this text for all subsequent revisions. e.g., Updated license to
      CC-BY-4.0 e.g., Added checksum after file transfer to OSTI e.g., Corrected collection
      end date'
    is_a: ont00000853
  creation_method:
    slots:
    - bfo_BFO_0000176
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
    title: creation_method
    description: '[discoverability_required] Method used to create or most recently
      update this data card. '
    is_a: ont00000853
  created_by:
    slots:
    - bfo_BFO_0000176
    - value
    slot_usage:
      bfo_BFO_0000176:
        range: datacard
      value:
        range: string
    title: created_by
    description: "[discoverability_required] All individuals, organizations, AI models,\
      \ or software tools that created or updated this data card. List in chronological\
      \ order of contribution \u2014 e.g., if an AI model generated the initial draft\
      \ and a person then edited it, list the AI model first."
    is_a: ont00001017
  contribution_date:
    slots:
    - bfo_BFO_0000176
    slot_usage:
      bfo_BFO_0000176:
        range: created_by
    title: contribution_date
    description: '[discoverability_required] ISO 8601 date of this specific contribution'
    is_a: ont00000853
  description:
    slots:
